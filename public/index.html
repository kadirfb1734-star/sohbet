<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#00a884">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Sohbet</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  :root{
    --acc:#00a884; --acc-d:#008f72; --bg:#f0f2f5; --panel:#ffffff; --panel2:#f7f8fa; --text:#111b21; --muted:#667781;
    --line:#e9edef; --out:#d9fdd3; --in:#ffffff; --chatbg:#efeae2; --dot:#d9d2c5; --shadow:0 1px 2px rgba(11,20,26,.14);
    --tick:#8696a0; --tickread:#53bdeb; --danger:#ea0038; --hover:#f5f6f6; --sel:#f0f2f5;
  }
  [data-theme="dark"]{
    --bg:#0b141a; --panel:#111b21; --panel2:#202c33; --text:#e9edef; --muted:#8696a0; --line:#222d34;
    --out:#005c4b; --in:#202c33; --chatbg:#0b141a; --dot:#16222a; --shadow:none; --hover:#182229; --sel:#2a3942;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
  input,textarea{font:inherit;color:var(--text)}
  .hidden{display:none !important}

  /* ---------- giriş ---------- */
  #auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;
    background:linear-gradient(180deg,var(--acc) 0,var(--acc) 38%,var(--bg) 38%);overflow:auto}
  .auth-card{width:100%;max-width:400px;background:var(--panel);border-radius:20px;padding:28px 24px 24px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
  .logo{width:64px;height:64px;border-radius:18px;background:var(--acc);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:32px}
  .auth-card h1{margin:0;text-align:center;font-size:26px}
  .auth-card .sub{margin:6px 0 20px;text-align:center;color:var(--muted);font-size:14px}
  .tabs{display:flex;background:var(--panel2);border-radius:12px;padding:4px;margin-bottom:16px}
  .tabs button{flex:1;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
  .tabs button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
  .field{display:block;margin-bottom:12px}
  .field span{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px 3px}
  .field input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--panel2);outline:none;font-size:16px}
  .field input:focus{border-color:var(--acc)}
  .pw{position:relative}
  .pw button{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:6px 10px;color:var(--muted);font-size:13px}
  .primary{width:100%;padding:13px;border-radius:12px;background:var(--acc);color:#fff;font-weight:700;font-size:16px;margin-top:4px}
  .primary:active{background:var(--acc-d)}
  .primary:disabled{opacity:.6}
  #authErr{color:var(--danger);font-size:13.5px;min-height:20px;margin-top:10px;text-align:center}

  /* ---------- uygulama düzeni ---------- */
  #app{display:none;height:100vh;height:100dvh}
  #app.show{display:grid;grid-template-columns:minmax(300px,400px) 1fr}
  #side{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-height:0}
  #main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;background:var(--chatbg);
    background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px}

  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--panel2);min-height:60px}
  .topbar .grow{flex:1;min-width:0}
  .topbar b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .topbar small.green{color:var(--acc)}
  .ibtn{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--muted);flex:none}
  .ibtn:hover{background:var(--sel)}
  .ibtn.back{display:none}

  .avatar{position:relative;width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:18px}
  .avatar .dot{position:absolute;right:0;bottom:0;width:12px;height:12px;border-radius:50%;background:#25d366;border:2px solid var(--panel)}
  .topbar .avatar .dot{border-color:var(--panel2)}

  .searchwrap{padding:8px 12px;background:var(--panel)}
  .searchwrap input{width:100%;padding:10px 14px;border-radius:12px;border:0;background:var(--panel2);outline:none;font-size:15px}
  #list{flex:1;overflow-y:auto;min-height:0}
  .sect{padding:10px 16px 4px;font-size:12.5px;color:var(--acc);font-weight:700}
  .item{display:flex;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--line)}
  .item:hover{background:var(--hover)}
  .item.sel{background:var(--sel)}
  .item .mid{flex:1;min-width:0}
  .item .row1,.item .row2{display:flex;align-items:center;gap:6px}
  .item .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .tm{font-size:12px;color:var(--muted)}
  .item .tm.unr{color:var(--acc)}
  .item .pv{flex:1;min-width:0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .pv.typing{color:var(--acc)}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--acc);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
  .emptylist{padding:32px 24px;text-align:center;color:var(--muted);font-size:14.5px;line-height:1.5}

  .tick{font-size:12px;letter-spacing:-2px;color:var(--tick);margin-left:2px}
  .tick.read{color:var(--tickread)}
  .tick.failed{color:var(--danger);letter-spacing:0}

  #empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--muted);padding:24px;background:var(--bg)}
  #empty .big{font-size:64px;margin-bottom:8px}
  #empty h2{margin:0 0 6px;color:var(--text)}

  #chatView{display:flex;flex-direction:column;flex:1;min-height:0}
  #msgs{flex:1;overflow-y:auto;padding:14px 5%;display:flex;flex-direction:column;gap:3px;min-height:0}
  .day{align-self:center;background:var(--panel);color:var(--muted);font-size:12px;padding:5px 12px;border-radius:8px;margin:10px 0;box-shadow:var(--shadow)}
  .b{max-width:min(78%,560px);padding:6px 9px 4px 10px;border-radius:10px;box-shadow:var(--shadow);word-wrap:break-word;overflow-wrap:anywhere;font-size:15.5px;line-height:1.35}
  .b.out{align-self:flex-end;background:var(--out);border-top-right-radius:3px}
  .b.in{align-self:flex-start;background:var(--in);border-top-left-radius:3px}
  .b .t{white-space:pre-wrap}
  .b a{color:#027eb5;text-decoration:underline}
  [data-theme="dark"] .b a{color:#53bdeb}
  .b .meta{display:flex;justify-content:flex-end;align-items:center;gap:2px;font-size:11px;color:var(--muted);margin-top:1px;float:right;padding-left:10px;position:relative;top:4px}
  .b::after{content:"";display:block;clear:both}
  .callmsg{align-self:center;background:var(--panel);color:var(--muted);font-size:13px;padding:6px 14px;border-radius:14px;box-shadow:var(--shadow);margin:4px 0}

  #composer{display:flex;align-items:flex-end;gap:8px;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));background:var(--panel2)}
  #text{flex:1;resize:none;max-height:120px;border:0;outline:none;background:var(--panel);border-radius:22px;padding:11px 16px;font-size:16px;line-height:1.3;overflow-y:auto}
  #sendBtn{width:46px;height:46px;border-radius:50%;background:var(--acc);color:#fff;font-size:20px;display:flex;align-items:center;justify-content:center;flex:none}
  #sendBtn:active{background:var(--acc-d)}

  #emoji{background:var(--panel);border-top:1px solid var(--line);max-height:230px;display:flex;flex-direction:column}
  #emojiTabs{display:flex;border-bottom:1px solid var(--line)}
  #emojiTabs button{flex:1;padding:8px;font-size:20px;opacity:.55}
  #emojiTabs button.on{opacity:1;border-bottom:3px solid var(--acc)}
  #emojiGrid{overflow-y:auto;padding:6px;display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
  #emojiGrid button{font-size:25px;padding:5px;border-radius:8px}
  #emojiGrid button:hover{background:var(--sel)}

  /* ---------- arama ---------- */
  #call{position:fixed;inset:0;z-index:50;background:linear-gradient(160deg,#0b3d36,#111b21);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:space-between;
    padding:calc(48px + env(safe-area-inset-top)) 24px calc(40px + env(safe-area-inset-bottom));overflow:hidden}
  #remoteVideo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000;opacity:0;pointer-events:none}
  #call.video.live #remoteVideo{opacity:1}
  #localVideo{position:absolute;right:14px;bottom:130px;width:96px;height:136px;object-fit:cover;border-radius:12px;background:#222;transform:scaleX(-1);display:none;box-shadow:0 4px 18px rgba(0,0,0,.5)}
  #call.video #localVideo{display:block}
  .cinfo{position:relative;text-align:center;z-index:2}
  .cinfo .avatar{width:112px;height:112px;font-size:46px;margin:0 auto 18px}
  .cinfo .avatar .dot{display:none}
  .cinfo h2{margin:0 0 6px;font-size:26px;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  .cinfo p{margin:0;opacity:.9;text-shadow:0 1px 6px rgba(0,0,0,.4)}
  #call.video.live .cinfo .avatar{display:none}
  #call.ringing .cinfo .avatar{animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 26px rgba(255,255,255,0)}}
  .cbtns{position:relative;z-index:2;display:flex;gap:26px;align-items:center}
  .cb{width:66px;height:66px;border-radius:50%;font-size:26px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.18);color:#fff}
  .cb.red{background:#e53935}.cb.grn{background:#25d366}
  .cb.on{background:#fff;color:#111}

  #toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111b21ee;color:#fff;padding:10px 18px;border-radius:22px;font-size:14px;z-index:99;max-width:90%;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s}
  #toast.show{opacity:1}

  /* ---------- telefon ---------- */
  @media (max-width:820px){
    #app.show{grid-template-columns:1fr}
    #main{display:none}
    #app.chat-open #side{display:none}
    #app.chat-open #main{display:flex}
    .ibtn.back{display:flex}
    #msgs{padding:12px 10px}
    .b{max-width:86%}
  }
  @media (min-width:821px){ #emptyBack{display:none} }
</style>
</head>
<body>

<!-- ======== GİRİŞ / KAYIT ======== -->
<div id="auth" class="hidden">
  <form class="auth-card" id="authForm" autocomplete="on">
    <div class="logo">💬</div>
    <h1>Sohbet</h1>
    <p class="sub">Arkadaşlarınla yaz, sesli ya da görüntülü konuş.</p>
    <div class="tabs">
      <button type="button" id="tabLogin" class="on">Giriş yap</button>
      <button type="button" id="tabReg">Kayıt ol</button>
    </div>
    <label class="field" id="nameField"><span>Adın (görünen isim)</span>
      <input id="aName" type="text" maxlength="30" placeholder="Örn. Ahmet" autocomplete="nickname">
    </label>
    <label class="field"><span>Kullanıcı adı</span>
      <input id="aUser" type="text" maxlength="20" placeholder="örn. ahmet34" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false">
    </label>
    <label class="field"><span>Şifre</span>
      <div class="pw">
        <input id="aPass" type="password" maxlength="100" placeholder="En az 6 karakter" autocomplete="current-password">
        <button type="button" id="pwToggle">Göster</button>
      </div>
    </label>
    <button class="primary" id="authBtn" type="submit">Giriş yap</button>
    <div id="authErr"></div>
  </form>
</div>

<!-- ======== UYGULAMA ======== -->
<div id="app">
  <aside id="side">
    <div class="topbar">
      <div id="meAv"></div>
      <div class="grow"><b id="meName"></b><small id="meUser"></small></div>
      <button class="ibtn" id="themeBtn" title="Tema">🌓</button>
      <button class="ibtn" id="logoutBtn" title="Çıkış yap">⎋</button>
    </div>
    <div class="searchwrap"><input id="search" type="text" placeholder="Sohbetlerde ara ya da yeni kişi bul (kullanıcı adı)" autocomplete="off" autocapitalize="off"></div>
    <div id="list"></div>
  </aside>

  <section id="main">
    <div id="empty">
      <div class="big">💬</div>
      <h2>Sohbet</h2>
      <p>Soldan bir sohbet seç ya da kullanıcı adıyla yeni kişi bul.</p>
    </div>

    <div id="chatView" class="hidden">
      <div class="topbar">
        <button class="ibtn back" id="backBtn" title="Geri">←</button>
        <div id="hAv"></div>
        <div class="grow"><b id="hName"></b><small id="hStat"></small></div>
        <button class="ibtn" id="vidBtn" title="Görüntülü ara">🎥</button>
        <button class="ibtn" id="audBtn" title="Sesli ara">📞</button>
      </div>
      <div id="msgs"></div>
      <div id="emoji" class="hidden">
        <div id="emojiTabs"></div>
        <div id="emojiGrid"></div>
      </div>
      <form id="composer" autocomplete="off">
        <button type="button" class="ibtn" id="emojiBtn" title="Emoji">😊</button>
        <textarea id="text" rows="1" placeholder="Mesaj yaz" maxlength="4000"></textarea>
        <button type="submit" id="sendBtn" title="Gönder">➤</button>
      </form>
    </div>
  </section>
</div>

<!-- ======== ARAMA ======== -->
<div id="call" class="hidden">
  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay playsinline muted></video>
  <div class="cinfo">
    <div id="callAv"></div>
    <h2 id="callName"></h2>
    <p id="callStatus"></p>
  </div>
  <div class="cbtns" id="callBtns"></div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';

/* ================= yardımcılar ================= */
var $ = function(id){ return document.getElementById(id); };
var DEVICE = Math.random().toString(36).slice(2, 10);
var store = {
  get: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set: function(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del: function(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function rand(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }

function h(tag, props){
  var e = document.createElement(tag);
  if(props){
    for(var k in props){
      var v = props[k];
      if(v === null || v === undefined) continue;
      if(k === 'class') e.className = v;
      else if(k === 'text') e.textContent = v;
      else if(k.slice(0,2) === 'on') e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    }
  }
  for(var i = 2; i < arguments.length; i++){
    var c = arguments[i];
    if(c === null || c === undefined) continue;
    e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return e;
}
function clear(el){ while(el.firstChild) el.removeChild(el.firstChild); }

function pad(n){ return n < 10 ? '0' + n : '' + n; }
function hm(ts){ var d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayKey(ts){ var d = new Date(ts); return d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate(); }
function isToday(ts){ return dayKey(ts) === dayKey(Date.now()); }
function isYesterday(ts){ return dayKey(ts) === dayKey(Date.now() - 864e5); }
function dmy(ts){ var d = new Date(ts); return pad(d.getDate()) + '.' + pad(d.getMonth()+1) + '.' + d.getFullYear(); }
function dayLabel(ts){
  if(isToday(ts)) return 'Bugün';
  if(isYesterday(ts)) return 'Dün';
  return new Date(ts).toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});
}
function listTime(ts){ return isToday(ts) ? hm(ts) : isYesterday(ts) ? 'Dün' : dmy(ts); }
function seenText(ts){
  if(!ts) return 'çevrimdışı';
  if(isToday(ts)) return 'son görülme bugün ' + hm(ts);
  if(isYesterday(ts)) return 'son görülme dün ' + hm(ts);
  return 'son görülme ' + dmy(ts);
}
function fmtDur(s){ return pad(Math.floor(s/60)) + ':' + pad(s%60); }

var toastTimer = null;
function toast(msg){
  var t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 3200);
}

function hue(s){ var x = 0; for(var i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) % 360; return x; }
function avatar(name, user, online){
  var a = h('div', {class:'avatar', style:'background:hsl(' + hue(user || name) + ',48%,46%)'}, (name || '?').trim().charAt(0).toUpperCase() || '?');
  if(online) a.appendChild(h('span', {class:'dot'}));
  return a;
}

/* ================= durum ================= */
var token = store.get('token');
var me = null;
var es = null;
var chats = new Map();    // kullanıcı adı -> {user,name,online,lastSeen,last,unread}
var msgs = new Map();     // kullanıcı adı -> mesaj dizisi
var current = null;
var typing = new Set();
var typingTimers = {};
var searchResults = [];
var searchTimer = null;
var iceCache = null;

/* ================= API ================= */
function api(path, opts){
  opts = opts || {};
  var headers = {'Content-Type':'application/json'};
  if(token) headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, {
    method: opts.method || (opts.body ? 'POST' : 'GET'),
    headers: headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }, function(){
    var where = location.protocol === 'file:'
      ? 'Bu sayfayı dosya olarak açtın. Önce bilgisayarda "node server.js" çalıştır, sonra tarayıcıda http://localhost:3000 adresini aç.'
      : 'Sunucuya ulaşılamadı. Sunucunun çalıştığından ve internetinin olduğundan emin ol.';
    throw new Error(where);
  }).then(function(res){
    return res.json().catch(function(){ return null; }).then(function(data){
      if(res.status === 404 && !data) throw new Error('Burada sunucu çalışmıyor. Uygulama Node.js sunucusuyla (node server.js) açılmalı; sadece statik dosya barındıran yerde çalışmaz.');
      if(res.status === 405 && !data) throw new Error('Burada sunucu çalışmıyor. Uygulama Node.js sunucusuyla (node server.js) açılmalı; sadece statik dosya barındıran yerde çalışmaz.');
      if(res.status === 401 && token && !opts.noRedirect){ doLogout(true); throw new Error('Oturum süresi doldu.'); }
      if(!res.ok) throw new Error((data && data.error) || 'Bir hata oluştu.');
      return data;
    });
  });
}

/* ================= giriş / kayıt ================= */
var mode = 'login';
function setMode(m){
  mode = m;
  $('tabLogin').classList.toggle('on', m === 'login');
  $('tabReg').classList.toggle('on', m === 'register');
  $('nameField').classList.toggle('hidden', m === 'login');
  $('authBtn').textContent = m === 'login' ? 'Giriş yap' : 'Hesap oluştur';
  $('aPass').setAttribute('autocomplete', m === 'login' ? 'current-password' : 'new-password');
  $('authErr').textContent = '';
}
$('tabLogin').onclick = function(){ setMode('login'); };
$('tabReg').onclick = function(){ setMode('register'); };
$('pwToggle').onclick = function(){
  var p = $('aPass'); var show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('pwToggle').textContent = show ? 'Gizle' : 'Göster';
};
$('authForm').onsubmit = function(e){
  e.preventDefault();
  var user = $('aUser').value.trim().toLowerCase();
  var pass = $('aPass').value;
  if(!user || !pass){ $('authErr').textContent = 'Kullanıcı adı ve şifre gerekli.'; return; }
  var body = {username: user, password: pass};
  if(mode === 'register') body.name = $('aName').value.trim();
  $('authBtn').disabled = true; $('authErr').textContent = '';
  api(mode === 'login' ? '/api/login' : '/api/register', {body: body, noRedirect: true}).then(function(r){
    token = r.token; store.set('token', token);
    $('aPass').value = '';
    return enterApp();
  }).catch(function(err){
    $('authErr').textContent = err.message;
  }).then(function(){ $('authBtn').disabled = false; });
};

function showAuth(){
  $('app').classList.remove('show');
  $('auth').classList.remove('hidden');
}

function doLogout(silent){
  if(call) endCall('', true);
  if(incoming) dismissIncoming('');
  if(!silent && token){ api('/api/logout', {body:{}, noRedirect:true}).catch(function(){}); }
  token = null; store.del('token');
  if(es){ es.close(); es = null; }

  document.title = 'Sohbet';

  if(silent) toast('Oturum süresi doldu. Tekrar giriş yap.');
}

/* ================= canlı bağlantı (SSE) ================= */
function connect(){
  if(es) es.close();
  var first = true;
  es = new EventSource('/api/stream?token=' + encodeURIComponent(token) + '&device=' + DEVICE);
  es.addEventListener('hello', function(){
    if(!first) refreshAll();
    first = false;
  });
  es.addEventListener('msg', function(ev){ onMsg(JSON.parse(ev.data)); });
  es.addEventListener('status', function(ev){ onStatus(JSON.parse(ev.data)); });
  es.addEventListener('presence', function(ev){ onPresence(JSON.parse(ev.data)); });
  es.addEventListener('typing', function(ev){ onTyping(JSON.parse(ev.data)); });
  es.addEventListener('readsync', function(ev){ onReadSync(JSON.parse(ev.data)); });
  es.addEventListener('signal', function(ev){ onSignal(JSON.parse(ev.data)); });
}

function refreshAll(){
  api('/api/me').then(function(r){
    var fresh = new Map();
    r.chats.forEach(function(c){ fresh.set(c.user, c); });
    chats = fresh;
    renderList();
    if(current){ loadHistory(current); updateHeader(); }
  }).catch(function(){});
}

/* ================= sohbet verisi ================= */
function upsert(arr, m){
  var i = -1;
  for(var k = 0; k < arr.length; k++){
    if(arr[k].id === m.id || (m.cid && arr[k].cid === m.cid)){ i = k; break; }
  }
  if(i >= 0){
    for(var key in m) arr[i][key] = m[key];
  } else {
    arr.push(m);
    arr.sort(function(a, b){ return a.ts - b.ts; });
  }
}
var RANK = {failed:-1, pending:0, sent:1, delivered:2, read:3};

function ensureChat(user, name){
  var c = chats.get(user);
  if(c) return c;
  c = {user: user, name: name || user, online: false, lastSeen: 0, last: null, unread: 0};
  chats.set(user, c);
  api('/api/user?u=' + encodeURIComponent(user)).then(function(u){
    c.name = u.name; c.online = u.online; c.lastSeen = u.lastSeen;
    renderList(); if(current === user) updateHeader();
  }).catch(function(){});
  return c;
}

function onMsg(p){
  var m = p.msg;
  var mine = m.from === me.username;
  var other = mine ? m.to : m.from;
  var chat = ensureChat(other, mine ? null : p.name);
  var arr = msgs.get(other);
  if(arr) upsert(arr, m);
  if(!chat.last || m.ts >= chat.last.ts) chat.last = m;
  if(!mine){
    typing.delete(other);
    var viewing = current === other && !document.hidden;
    if(viewing){
      markRead(other);
    } else {
      chat.unread++;
      if(m.kind !== 'call') alertNew(chat, m);
    }
  }
  renderList();
  if(current === other){ renderMessages(); updateHeader(); }
  updateTitle();
}

function onStatus(p){
  var arr = msgs.get(p.with);
  var changed = false;
  p.ids.forEach(function(id){
    if(arr){
      for(var i = 0; i < arr.length; i++){
        if(arr[i].id === id && RANK[p.status] > RANK[arr[i].status]){ arr[i].status = p.status; changed = true; }
      }
    }
    var c = chats.get(p.with);
    if(c && c.last && c.last.id === id && RANK[p.status] > RANK[c.last.status]){ c.last.status = p.status; changed = true; }
  });
  if(changed){ renderList(); if(current === p.with) renderMessages(); }
}

function onPresence(p){
  var c = chats.get(p.user);
  if(!c) return;
  c.online = p.online; c.lastSeen = p.lastSeen;
  if(p.online === false) typing.delete(p.user);
  renderList();
  if(current === p.user) updateHeader();
}

function onTyping(p){
  typing.add(p.from);
  clearTimeout(typingTimers[p.from]);
  typingTimers[p.from] = setTimeout(function(){
    typing.delete(p.from); renderList(); if(current === p.from) updateHeader();
  }, 3500);
  renderList();
  if(current === p.from) updateHeader();
}

function onReadSync(p){
  var c = chats.get(p.with);
  if(c && c.unread){ c.unread = 0; renderList(); updateTitle(); }
}

function markRead(user){
  var c = chats.get(user);
  if(c) c.unread = 0;
  api('/api/read', {body:{with:user}}).catch(function(){});
  updateTitle();
}

function loadHistory(user){
  return api('/api/history?with=' + encodeURIComponent(user)).then(function(r){
    var arr = msgs.get(user) || [];
    var pending = arr.filter(function(m){ return m.status === 'pending' || m.status === 'failed'; });
    var merged = r.messages.slice();
    pending.forEach(function(m){ upsert(merged, m); });
    msgs.set(user, merged);
    var c = chats.get(user);
    if(c && merged.length){ c.last = merged[merged.length - 1]; }
    if(current === user){ renderMessages(true); }
    renderList();
  }).catch(function(){});
}

/* ================= sohbet listesi ================= */
function tickNode(status){
  var t = h('span', {class:'tick'});
  if(status === 'pending'){ t.textContent = '◷'; t.style.letterSpacing = '0'; }
  else if(status === 'sent'){ t.textContent = '✓'; t.style.letterSpacing = '0'; }
  else if(status === 'delivered'){ t.textContent = '✓✓'; }
  else if(status === 'read'){ t.textContent = '✓✓'; t.classList.add('read'); }
  else if(status === 'failed'){ t.textContent = '❗'; t.classList.add('failed'); }
  return t;
}

function renderList(){
  var box = $('list');
  clear(box);
  var q = $('search').value.trim().toLowerCase();
  var items = Array.from(chats.values()).filter(function(c){
    if(!c.last && c.user !== current) return false;
    return !q || c.name.toLowerCase().indexOf(q) >= 0 || c.user.indexOf(q) >= 0;
  }).sort(function(a, b){ return (b.last ? b.last.ts : 0) - (a.last ? a.last.ts : 0); });

  items.forEach(function(c){
    var isTyping = typing.has(c.user);
    var pv = h('div', {class:'pv' + (isTyping ? ' typing' : '')});
    if(isTyping){ pv.textContent = 'yazıyor...'; }
    else if(c.last){
      if(c.last.from === me.username && c.last.kind !== 'call') pv.appendChild(tickNode(c.last.status));
      if(c.last.from === me.username && c.last.kind !== 'call') pv.appendChild(document.createTextNode(' '));
      pv.appendChild(document.createTextNode((c.last.kind === 'call' ? '📞 ' : '') + c.last.text.replace(/\n/g, ' ')));
    }
    var row2 = h('div', {class:'row2'}, pv, c.unread ? h('span', {class:'badge'}, String(c.unread > 99 ? '99+' : c.unread)) : null);
    var el = h('div', {class:'item' + (current === c.user ? ' sel' : ''), onclick: function(){ openChat(c.user); }},
      avatar(c.name, c.user, c.online),
      h('div', {class:'mid'},
        h('div', {class:'row1'}, h('div', {class:'nm', text:c.name}), c.last ? h('span', {class:'tm' + (c.unread ? ' unr' : ''), text:listTime(c.last.ts)}) : null),
        row2));
    box.appendChild(el);
  });

  var found = searchResults.filter(function(u){
    var c = chats.get(u.username); return !c || !c.last;
  });
  if(q.length >= 3 && found.length){
    box.appendChild(h('div', {class:'sect'}, 'Yeni kişiler'));
    found.forEach(function(u){
      box.appendChild(h('div', {class:'item', onclick: function(){
        var c = ensureChat(u.username, u.name);
        c.name = u.name; c.online = u.online; c.lastSeen = u.lastSeen;
        $('search').value = ''; searchResults = [];
        openChat(u.username);
      }}, avatar(u.name, u.username, u.online),
         h('div', {class:'mid'}, h('div', {class:'nm', text:u.name}), h('div', {class:'pv', text:'@' + u.username}))));
    });
  }

  if(!box.firstChild){
    box.appendChild(h('div', {class:'emptylist'},
      q ? (q.length < 3 ? 'Eşleşen sohbet yok.' : 'Kimse bulunamadı. Arkadaşının kullanıcı adını tam yaz.') :
      'Henüz sohbetin yok.\nYukarıdaki kutuya arkadaşının kullanıcı adını yazarak onu bul.'));
    box.firstChild.style.whiteSpace = 'pre-line';
  }
}

function linkify(text){
  var frag = document.createDocumentFragment();
  var re = /(https?:\/\/[^\s<>"]+)/g, last = 0, m;
  while((m = re.exec(text)) !== null){
    if(m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    frag.appendChild(h('a', {href:m[0], target:'_blank', rel:'noopener noreferrer', text:m[0]}));
    last = m.index + m[0].length;
  }
  if(last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}

function bubble(m){
  if(m.kind === 'call'){
    return h('div', {class:'callmsg'}, '📞 ' + m.text + ' · ' + hm(m.ts));
  }
  var out = m.from === me.username;
  var t = h('span', {class:'t'}); t.appendChild(linkify(m.text));
  var meta = h('span', {class:'meta'}, hm(m.ts), out ? tickNode(m.status) : null);
  var b = h('div', {class:'b ' + (out ? 'out' : 'in')}, t, meta);
  if(m.status === 'failed'){
    b.title = 'Gönderilemedi. Tekrar denemek için dokun.';
    b.style.cursor = 'pointer';
    b.addEventListener('click', function(){ retrySend(m); });
  }
  return b;
}

function renderMessages(forceBottom){
  var box = $('msgs');

  var atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 90;
  clear(box);
  var lastDay = '';
  arr.forEach(function(m){
    var d = dayKey(m.ts);
    if(d !== lastDay){ box.appendChild(h('div', {class:'day', text:dayLabel(m.ts)})); lastDay = d; }
    box.appendChild(bubble(m));
  });
  if(atBottom || forceBottom) box.scrollTop = box.scrollHeight;
}

/* ================= mesaj gönderme ================= */
function sendMessage(to, text, kind){
  var cid = rand();
  var m = {id:'t-' + cid, cid:cid, from:me.username, to:to, text:text, kind:kind || 'text', ts:Date.now(), status:'pending'};
  var arr = msgs.get(to); if(!arr){ arr = []; msgs.set(to, arr); }
  upsert(arr, m);
  var c = ensureChat(to); c.last = m;
  renderList();
  if(current === to) renderMessages(true);
  postMessage(m);
}
function postMessage(m){
  api('/api/send', {body:{to:m.to, text:m.text, kind:m.kind, cid:m.cid}}).then(function(r){
    var arr = msgs.get(m.to) || [];
    upsert(arr, r.msg);
    var c = chats.get(m.to); if(c && (!c.last || r.msg.ts >= c.last.ts)) c.last = r.msg;
    renderList();
    if(current === m.to) renderMessages();
  }).catch(function(err){
    m.status = 'failed';
    renderList();
    if(current === m.to) renderMessages();
    toast(err.message);
  });
}
function retrySend(m){ m.status = 'pending'; if(current === m.to) renderMessages(); postMessage(m); }

/* ================= bildirim / ses ================= */
var audioCtx = null;
function getAudio(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
  }catch(e){}
  return audioCtx;
}
function beep(freq, dur, vol){
  var ac = getAudio(); if(!ac) return;
  try{
    var o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.12, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + dur);
    o.connect(g); g.connect(ac.destination);
    o.start(); o.stop(ac.currentTime + dur);
  }catch(e){}
}
function alertNew(chat, m){
  beep(880, 0.18, 0.1);
  if('Notification' in window && Notification.permission === 'granted' && document.hidden){
    try{
      var n = new Notification(chat.name, {body:m.text.slice(0, 140), tag:'chat-' + chat.user, icon:'/icon.svg'});
      n.onclick = function(){ window.focus(); openChat(chat.user); n.close(); };
    }catch(e){}
  }
}
function updateTitle(){
  var n = 0; chats.forEach(function(c){ n += c.unread || 0; });
  document.title = n ? '(' + n + ') Sohbet' : 'Sohbet';
}
document.addEventListener('click', function once(){
  getAudio();
  if('Notification' in window && Notification.permission === 'default'){ try{ Notification.requestPermission(); }catch(e){} }
  document.removeEventListener('click', once);
});

  if(!document.hidden && current){

    if(c && c.unread) markRead(current);
  }
});

function getMedia(type){
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.RTCPeerConnection){
    return Promise.reject(new Error('Arama için sayfa https:// ile açılmalı (ya da localhost).'));
  }
  return navigator.mediaDevices.getUserMedia({audio:true, video: type === 'video' ? {facingMode:'user'} : false}).catch(function(){
    throw new Error(type === 'video' ? 'Kamera ve mikrofon izni verilmedi.' : 'Mikrofon izni verilmedi.');
  });
}

function showCallUI(c, state){
  var ov = $('call');
  ov.classList.remove('hidden');
  ov.classList.toggle('video', c.type === 'video');
  ov.classList.toggle('live', state === 'connected');
  ov.classList.toggle('ringing', state === 'incoming' || state === 'calling');
  var name = peerName(c.peer);
  $('callName').textContent = name;
  clear($('callAv')); $('callAv').appendChild(avatar(name, c.peer, false));
  var kind = c.type === 'video' ? 'Görüntülü arama' : 'Sesli arama';
  $('callStatus').textContent = state === 'calling' ? 'Aranıyor...' : state === 'incoming' ? kind : state === 'connecting' ? 'Bağlanıyor...' : fmtDur(c.startedAt ? Math.round((Date.now() - c.startedAt) / 1000) : 0);
  var b = $('callBtns'); clear(b);
  if(state === 'incoming'){
    b.appendChild(cbtn('red', '✖', 'Reddet', rejectIncoming));
    b.appendChild(cbtn('grn', c.type === 'video' ? '🎥' : '📞', 'Cevapla', acceptIncoming));
  } else if(state === 'calling' || state === 'connecting'){
    b.appendChild(cbtn('red', '⏹', 'Kapat', function(){ endCall('', true); }));
  } else {
    var mute = cbtn('', '🎤', 'Sessiz', function(){ toggleMute(mute); });
    b.appendChild(mute);
    if(c.type === 'video'){
      var cam = cbtn('', '📷', 'Kamera', function(){ toggleCam(cam); });
      b.appendChild(cam);
    }
    b.appendChild(cbtn('red', '⏹', 'Kapat', function(){ endCall('', true); }));
  }
  if(c.type === 'video' && c.localStream) $('localVideo').srcObject = c.localStream;
}

function toggleMute(btn){
  if(!call) return;
  call.muted = !call.muted;
  call.localStream.getAudioTracks().forEach(function(t){ t.enabled = !call.muted; });
  btn.classList.toggle('on', call.muted); btn.textContent = call.muted ? '🔇' : '🎤';
}
function toggleCam(btn){
  if(!call) return;
  call.camOff = !call.camOff;
  call.localStream.getVideoTracks().forEach(function(t){ t.enabled = !call.camOff; });
  btn.classList.toggle('on', call.camOff); btn.textContent = call.camOff ? '🚫' : '📷';
}

function makePc(c){
  var pc = new RTCPeerConnection({iceServers:c.ice});
  c.pc = pc;
  c.localStream.getTracks().forEach(function(t){ pc.addTrack(t, c.localStream); });
  pc.onicecandidate = function(e){
    if(e.candidate) sendSignal(c.peer, {type:'ice', callId:c.id, candidate:e.candidate.toJSON ? e.candidate.toJSON() : e.candidate});
  };
  pc.ontrack = function(e){
    var rv = $('remoteVideo');
    if(e.streams && e.streams[0] && rv.srcObject !== e.streams[0]) rv.srcObject = e.streams[0];
    var p = rv.play(); if(p && p.catch) p.catch(function(){});
  };
  pc.onconnectionstatechange = function(){
    if(call !== c) return;
    var s = pc.connectionState;
    if(s === 'connected'){
      clearTimeout(c.dcTimer);
      if(!c.startedAt){
        c.startedAt = Date.now();
        clearTimeout(c.ringTimer);
        showCallUI(c, 'connected');
        c.timer = setInterval(function(){ $('callStatus').textContent = fmtDur(Math.round((Date.now() - c.startedAt) / 1000)); }, 500);
      }
    } else if(s === 'failed'){
      endCall('Bağlantı kurulamadı.', true);
    } else if(s === 'disconnected'){
      clearTimeout(c.dcTimer);
      c.dcTimer = setTimeout(function(){ if(call === c && pc.connectionState === 'disconnected') endCall('Bağlantı koptu.', true); }, 8000);
    }
  };
  return pc;
}

function startCall(type){
  if(call || incoming || !current) return;
  var peer = current;
  var stream, ice;
  getMedia(type).then(function(s){
    stream = s;
    return loadIce();
  }).then(function(servers){
    ice = servers;
    if(call || incoming){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    var c = {id:rand(), peer:peer, type:type, role:'caller', localStream:stream, ice:ice, pendingIce:[], startedAt:0};
    call = c;
    showCallUI(c, 'calling');
    var pc = makePc(c);
    return pc.createOffer().then(function(offer){
      return pc.setLocalDescription(offer);
    }).then(function(){
      sendSignal(peer, {type:'offer', callId:c.id, callType:type, sdpType:pc.localDescription.type, sdp:pc.localDescription.sdp});
      c.ringTimer = setTimeout(function(){ if(call === c && !c.startedAt) endCall('Cevap yok.', true); }, 45000);
    }).catch(function(){ if(call === c) endCall('Arama başlatılamadı.', true); });
  }).catch(function(err){
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
    toast(err.message);
  });
}
$('audBtn').onclick = function(){ startCall('audio'); };
$('vidBtn').onclick = function(){ startCall('video'); };

function endCall(reason, notify, outcome){
  var c = call;
  if(!c) return;
  call = null;
  clearTimeout(c.ringTimer); clearTimeout(c.dcTimer); clearInterval(c.timer);
  stopRing();
  if(notify !== false) sendSignal(c.peer, {type:'hangup', callId:c.id});
  try{ if(c.pc) c.pc.close(); }catch(e){}
  if(c.localStream) c.localStream.getTracks().forEach(function(t){ t.stop(); });
  $('remoteVideo').srcObject = null; $('localVideo').srcObject = null;
  $('call').classList.add('hidden');
  var dur = c.startedAt ? Math.round((Date.now() - c.startedAt) / 1000) : 0;
  if(c.role === 'caller' && me){
    var label = c.type === 'video' ? 'Görüntülü arama' : 'Sesli arama';
    var text;
    if(dur > 0) text = label + ' · ' + fmtDur(dur);
    else if(outcome === 'rejected') text = label + ' · Reddedildi';
    else if(outcome === 'busy') text = label + ' · Meşgul';
    else text = 'Cevapsız ' + label.toLowerCase();
    sendMessage(c.peer, text, 'call');
  }
  if(reason) toast(reason);
}

function onSignal(p){
  var d = p.data, from = p.from;
  if(!d || !d.type) return;
  if(d.type === 'offer'){ onOffer(from, d); return; }
  if(d.type === 'taken'){
    if(incoming && incoming.id === d.callId && d.device !== DEVICE) dismissIncoming('Başka cihazda cevaplandı.');
    return;
  }
  if(call && call.id === d.callId){
    var c = call;
    if(d.type === 'answer' && c.role === 'caller' && !c.answered){
      c.answered = true;
      c.pc.setRemoteDescription({type:'answer', sdp:d.sdp}).then(function(){
        c.pendingIce.forEach(function(cand){ c.pc.addIceCandidate(cand).catch(function(){}); });
        c.pendingIce = [];
        if(call === c && !c.startedAt) showCallUI(c, 'connecting');
        clearTimeout(c.ringTimer);
      }).catch(function(){ endCall('Bağlantı kurulamadı.', true); });
    } else if(d.type === 'ice'){
      if(c.pc.remoteDescription) c.pc.addIceCandidate(d.candidate).catch(function(){});
      else c.pendingIce.push(d.candidate);
    } else if(d.type === 'reject'){ endCall('Arama reddedildi.', false, 'rejected'); }
    else if(d.type === 'busy'){ endCall('Kullanıcı meşgul.', false, 'busy'); }
    else if(d.type === 'hangup'){ endCall('Arama bitti.', false); }
    return;
  }
  if(incoming && incoming.id === d.callId){
    if(d.type === 'ice') incoming.ice.push(d.candidate);
    else if(d.type === 'hangup') dismissIncoming('Cevapsız arama.');
    return;
  }
  if(d.type === 'ice'){
    if(!earlyIce[d.callId]) earlyIce[d.callId] = [];
    earlyIce[d.callId].push(d.candidate);
  }
}

function onOffer(from, d){
  if(call || incoming){ sendSignal(from, {type:'busy', callId:d.callId}); return; }
  var inc = {
    id: d.callId, peer: from, type: d.callType === 'video' ? 'video' : 'audio',
    sdp: {type: d.sdpType || 'offer', sdp: d.sdp},
    ice: earlyIce[d.callId] || []
  };
  delete earlyIce[d.callId];
  incoming = inc;
  ensureChat(from);
  showCallUI(inc, 'incoming');
  startRing();
  if('Notification' in window && Notification.permission === 'granted' && document.hidden){
    try{ new Notification(peerName(from), {body:'Seni arıyor...', tag:'call'}); }catch(e){}
  }
  inc.timer = setTimeout(function(){ if(incoming === inc) dismissIncoming(''); }, 45000);
  // isim sonradan gelirse güncelle
  setTimeout(function(){ if(incoming === inc) $('callName').textContent = peerName(from); }, 700);
}

function dismissIncoming(msg){
  var inc = incoming;
  if(!inc) return;
  clearTimeout(inc.timer);
  stopRing();
  incoming = null;
  $('call').classList.add('hidden');
  if(msg) toast(msg);
}

function rejectIncoming(){
  var inc = incoming; if(!inc) return;
  sendSignal(inc.peer, {type:'reject', callId:inc.id});
  dismissIncoming('');
}

function acceptIncoming(){
  var inc = incoming; if(!inc || inc.accepting) return;
  inc.accepting = true;
  clearTimeout(inc.timer);
  stopRing();
  var stream;
  getMedia(inc.type).then(function(s){
    stream = s;
    return loadIce();
  }).then(function(ice){
    if(incoming !== inc){ stream.getTracks().forEach(function(t){ t.stop(); }); return; }
    var c = {id:inc.id, peer:inc.peer, type:inc.type, role:'callee', localStream:stream, ice:ice, pendingIce:[], startedAt:0};
    call = c; incoming = null;
    showCallUI(c, 'connecting');
    var pc = makePc(c);
    return pc.setRemoteDescription(inc.sdp).then(function(){
      inc.ice.concat(c.pendingIce).forEach(function(cand){ pc.addIceCandidate(cand).catch(function(){}); });
      c.pendingIce = [];
      return pc.createAnswer();
    }).then(function(ans){
      return pc.setLocalDescription(ans);
    }).then(function(){
      sendSignal(c.peer, {type:'answer', callId:c.id, sdp:pc.localDescription.sdp});
      sendSignal(me.username, {type:'taken', callId:c.id, device:DEVICE});
    }).catch(function(){ if(call === c) endCall('Arama başlatılamadı.', true); });
  }).catch(function(err){
    if(stream) stream.getTracks().forEach(function(t){ t.stop(); });
    toast(err.message);
    if(incoming === inc){
      sendSignal(inc.peer, {type:'reject', callId:inc.id});
      dismissIncoming('');
    }
  });
}

/* ================= başlangıç ================= */
setMode('login');
if(token){
  enterApp().catch(function(){ if(token){ showAuth(); } });
} else {
  showAuth();
}

})();
</script>
